name: Tests
on: [push, pull_request]
jobs:
  bridge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            symfony: '^5.4'
            thinkphp: '~8.1'
          - php: '8.1'
            symfony: '^6.4'
            thinkphp: '~8.1'
          - php: '8.2'
            symfony: '^7.0'
            thinkphp: '~8.1'
          - php: '8.4'
            symfony: '^7.0'
            thinkphp: '~8.1'
          - php: '8.5'
            symfony: '^6.4'
            thinkphp: '~8.1'
          - php: '8.5'
            symfony: '^7.0'
            thinkphp: '~8.1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer update --with 'symfony/console:${{ matrix.symfony }}' --with 'topthink/framework:${{ matrix.thinkphp }}' --no-interaction --prefer-dist
      - run: composer audit
      - run: composer test
